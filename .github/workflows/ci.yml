name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
    tags: ["test-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: ruff check .
      - run: pytest -q

  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dwella_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: dwella_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U dwella_test -d dwella_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://dwella_test:test-only@127.0.0.1:5432/dwella_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest apps/audit -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [backend, backend-postgres, frontend]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: dwella-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload release
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        run: |
          ssh "$PROD_SSH_USER@$PROD_SSH_HOST" "mkdir -p '$PROD_DEPLOY_PATH.release'"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'data/' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude '.venv/' \
            --exclude '__pycache__/' \
            --exclude '*.sqlite3' \
            ./ "$PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH.release/"
          ssh "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "test -f '$PROD_DEPLOY_PATH/.env.prod' &&
             cp '$PROD_DEPLOY_PATH/.env.prod' '$PROD_DEPLOY_PATH.release/.env.prod'"
      - name: Activate release
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        run: |
          ssh "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "chmod +x '$PROD_DEPLOY_PATH.release/deploy/activate-release.sh' &&
             '$PROD_DEPLOY_PATH.release/deploy/activate-release.sh' '$PROD_DEPLOY_PATH'"

  deploy-staging:
    if: startsWith(github.ref, 'refs/tags/test-v')
    needs: [backend, backend-postgres, frontend]
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: dwella-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require tagged commit to belong to develop
        run: |
          git fetch origin develop
          git merge-base --is-ancestor "$GITHUB_SHA" origin/develop || {
            echo "Refusing staging deployment: $GITHUB_SHA is not contained in origin/develop."
            exit 1
          }
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload staging release
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          ssh "$STAGING_SSH_USER@$STAGING_SSH_HOST" "mkdir -p '$STAGING_DEPLOY_PATH.release'"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'data/' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude '.venv/' \
            --exclude '__pycache__/' \
            --exclude '*.sqlite3' \
            ./ "$STAGING_SSH_USER@$STAGING_SSH_HOST:$STAGING_DEPLOY_PATH.release/"
          ssh "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "test -f '$STAGING_DEPLOY_PATH/.env.test' &&
             cp '$STAGING_DEPLOY_PATH/.env.test' '$STAGING_DEPLOY_PATH.release/.env.test'"
      - name: Activate staging release
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          ssh "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "chmod +x '$STAGING_DEPLOY_PATH.release/deploy/activate-test-release.sh' &&
             '$STAGING_DEPLOY_PATH.release/deploy/activate-test-release.sh' '$STAGING_DEPLOY_PATH'"
