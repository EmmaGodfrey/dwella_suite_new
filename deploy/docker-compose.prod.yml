name: dwella-suite

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dwella_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - dwella_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: dwella-suite-backend:latest
    restart: unless-stopped
    env_file:
      - ../.env.prod
    environment:
      # Shared by every gunicorn worker: rate limits and rendered document pages.
      APP_CACHE_URL: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../data/media:/app/backend/media
      - dwella_static_data:/app/backend/staticfiles
    ports:
      - "127.0.0.1:8120:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/api/health/', headers={'Host': 'api.dwella.properties', 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=5)"
      interval: 20s
      timeout: 6s
      retries: 5
      start_period: 30s

  # Runs the recurring jobs listed in APP_SCHEDULER_JOBS (see apps/scheduler/jobs.py)
  # and records every run. Reuses the backend image; the backend's healthcheck
  # means migrations have already run. Add "billing" to start daily rent runs.
  scheduler:
    image: dwella-suite-backend:latest
    pull_policy: never
    restart: unless-stopped
    env_file:
      - ../.env.prod
    environment:
      APP_CACHE_URL: redis://redis:6379/1
      APP_SCHEDULER_JOBS: ${APP_SCHEDULER_JOBS:-beta_emails,media_snapshots,offsite_backups}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      # offsite_backups copies data/backups to BACKUP_S3_* (or STORAGE_S3_*) hourly.
      APP_BACKUP_DIR: /backups
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-_backups/production/}
    depends_on:
      backend:
        condition: service_healthy
    entrypoint: ["python", "manage.py", "run_scheduler"]
    volumes:
      - ../data/backups:/backups

  # Nightly verified database dump and media archive under data/backups.
  # Restore with deploy/restore-backup.sh. Copy data/backups off this server too.
  backup:
    image: postgres:16-alpine
    user: "1000:1000"
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../data/backups:/backups
      - ../data/media:/media:ro
      - ./backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["sh", "/backup-loop.sh"]

  frontend:
    environment:
      MEDIA_CSP_ORIGIN: ${MEDIA_CSP_ORIGIN:-}
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_APP_NAME: Dwella Suite
        VITE_API_BASE_URL: https://api.dwella.properties/api/v1
        VITE_HANDY_AGENT_ENABLED: ${VITE_HANDY_AGENT_ENABLED:-false}
        VITE_HANDY_AGENT_URL: ${VITE_HANDY_AGENT_URL:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ../data/media:/usr/share/nginx/media:ro
    ports:
      - "127.0.0.1:8121:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  dwella_postgres_data:
  dwella_redis_data:
  dwella_static_data:

