name: dwella-suite

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dwella_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - dwella_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: dwella-suite-backend:latest
    restart: unless-stopped
    env_file:
      - ../.env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../data/media:/app/backend/media
      - dwella_static_data:/app/backend/staticfiles
    ports:
      - "127.0.0.1:8120:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/api/health/', headers={'Host': 'api.dwella.properties', 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=5)"
      interval: 20s
      timeout: 6s
      retries: 5
      start_period: 30s

  # Sends due beta applicant emails every 15 minutes. Reuses the backend image;
  # the backend's healthcheck means migrations have already run.
  beta-mailer:
    image: dwella-suite-backend:latest
    pull_policy: never
    restart: unless-stopped
    env_file:
      - ../.env.prod
    depends_on:
      backend:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - "while true; do python manage.py send_beta_emails || true; sleep 900; done"

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_APP_NAME: Dwella Suite
        VITE_API_BASE_URL: https://api.dwella.properties/api/v1
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ../data/media:/usr/share/nginx/media:ro
    ports:
      - "127.0.0.1:8121:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  dwella_postgres_data:
  dwella_redis_data:
  dwella_static_data:

