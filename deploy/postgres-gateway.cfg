global
    log stdout format raw local0

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 1m
    timeout server 1m

frontend staging_postgres
    bind 0.0.0.0:5433
    acl assistant_source src 37.27.247.86/32
    tcp-request connection reject if !assistant_source
    default_backend staging_postgres_backend

backend staging_postgres_backend
    server postgres 127.0.0.1:55432 check
