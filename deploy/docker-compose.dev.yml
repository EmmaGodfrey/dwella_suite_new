services:
  postgres:
    image: postgres:16-alpine
    container_name: dwella-suite-postgres
    environment:
      POSTGRES_DB: dwella_suite
      POSTGRES_USER: dwella
      POSTGRES_PASSWORD: dwella
    ports:
      - "5432:5432"
    volumes:
      - dwella_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dwella-suite-redis
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: dwella-suite-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  dwella_postgres_data:
