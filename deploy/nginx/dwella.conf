# Do not write callback credentials or signing-link query strings into access logs.
log_format dwella_no_query '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri $server_protocol" $status $body_bytes_sent';
access_log /var/log/nginx/access.log dwella_no_query;

# One address for search engines: www redirects to the bare domain.
server {
    listen 80;
    listen [::]:80;
    server_name www.dwella.properties;
    return 301 https://dwella.properties$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name dwella.properties;

    location / {
        proxy_pass http://127.0.0.1:8122;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name app.dwella.properties;

    location = /test {
        return 301 /test/;
    }

    location ^~ /test/media/profiles/verification_documents/ { return 404; }

    location ^~ /test/media/ {
        rewrite ^/test/media/(.*)$ /media/$1 break;
        proxy_pass http://127.0.0.1:8131;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /test/api/ {
        rewrite ^/test/api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:8130;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /test/ {
        rewrite ^/test/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8131;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /media/profiles/verification_documents/ { return 404; }

    location /media/ {
        proxy_pass http://127.0.0.1:8121;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8121;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.dwella.properties;

    location ^~ /media/profiles/verification_documents/ { return 404; }

    client_max_body_size 6m;

    # API responses are not pages; keep them out of search results.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /media/ {
        proxy_pass http://127.0.0.1:8121;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8120;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

